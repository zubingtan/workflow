name: M0 Three-run Release Gate

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact main commit to verify three times
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      git_sha: ${{ steps.candidate.outputs.git_sha }}
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: |
          if [[ "${{ github.run_attempt }}" != "1" ]]; then
            echo "A rerun cannot count as a new consecutive pass" >&2
            exit 1
          fi
      - name: Check out repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Validate candidate is current main
        id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          test "$REQUESTED_SHA" = "$main_sha"
          echo "git_sha=$main_sha" >> "$GITHUB_OUTPUT"

  run1:
    needs: validate
    uses: ./.github/workflows/m0-acceptance.yml
    with:
      git_sha: ${{ needs.validate.outputs.git_sha }}
      run_label: run1
      reject_rerun: true

  run2:
    needs: [validate, run1]
    uses: ./.github/workflows/m0-acceptance.yml
    with:
      git_sha: ${{ needs.validate.outputs.git_sha }}
      run_label: run2
      reject_rerun: true

  run3:
    needs: [validate, run2]
    uses: ./.github/workflows/m0-acceptance.yml
    with:
      git_sha: ${{ needs.validate.outputs.git_sha }}
      run_label: run3
      reject_rerun: true

  aggregate:
    needs: [run1, run2, run3]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verified commit
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.git_sha }}
      - name: Download all three evidence bundles
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: m0-evidence-${{ inputs.git_sha }}-run*
          path: aggregate/runs
      - name: Verify and aggregate immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(find aggregate/runs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "3"
          for bundle in aggregate/runs/*; do
            node scripts/acceptance/validate-evidence.mjs --bundle "$bundle" --secret ABSENT_RELEASE_SECRET
            test "$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).gitSha' "$bundle/report.json")" = "${{ inputs.git_sha }}"
          done
          find aggregate/runs -type f -print | LC_ALL=C sort > aggregate/MANIFEST
          while IFS= read -r file; do sha256sum "$file"; done < aggregate/MANIFEST > aggregate/SHA256SUMS
      - name: Upload aggregate evidence
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m0-three-run-evidence-${{ inputs.git_sha }}
          path: aggregate
          if-no-files-found: error
          retention-days: 90
