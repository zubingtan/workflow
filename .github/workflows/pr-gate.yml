name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: governance and bootstrap contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run governance contract tests
        run: npm test

  bootstrap-system:
    name: bootstrap system
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run clean Compose bootstrap
        run: test/bootstrap/system-bootstrap.sh
