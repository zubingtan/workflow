name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  merge-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge-base is latest main
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main)
          MAIN_HEAD=$(git rev-parse origin/main)
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "::error::Branch is behind main — please rebase onto latest main locally, then force-push to update this PR."
            echo ""
            echo "  merge-base:  $MERGE_BASE"
            echo "  origin/main: $MAIN_HEAD"
            echo ""
            echo "  Run locally:"
            echo "    git fetch origin"
            echo "    git rebase origin/main"
            echo "    git push --force-with-lease"
            exit 1
          fi
          echo "merge-base is up to date with main."

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm ts-check

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium, with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload e2e server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.logs/
          retention-days: 14
