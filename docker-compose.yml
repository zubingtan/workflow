# T6 (#116 #122): single-command zero-config deployment.
#
# Usage:
#   docker compose up -d           # start
#   docker compose logs -f app     # tail logs
#   docker compose down            # stop (keeps data volume)
#   docker compose down -v         # stop + delete data
#
# fake-provider (dev mock) validates request Authorization headers against
# FAKE_PROVIDER_API_KEY. Set it in your shell before `docker compose up`. The
# server itself no longer needs any API key env — agent credentials are stored
# in the DB (set via the Agents UI). Do NOT put secrets in a .env file next to
# this compose file — that's what `environment:` passthrough avoids.
#
# Port override: `PORT=8080 docker compose up` listens on 8080 instead of 4000.
#
# mem0 (#212 D8): self-hosted semantic memory for agents. mem0 + pgvector are
# started alongside the app (user story 5 — one command brings up the full
# platform). mem0 listens on 8890 (isolated from any locally running mem0).
# Point the Settings UI's Mem0 Server URL at http://localhost:8890 and set
# OPENAI_BASE_URL / OPENAI_API_KEY / EMBEDDING_MODEL / EMBEDDING_DIMS in your
# shell so mem0's LLM + embedder point at your OpenAI-compatible provider.

services:
  app:
    build: .
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    volumes:
      - workflow-data:/app/data
    environment:
      # fake-provider (dev mock) reads this to validate request Authorization
      # headers. The server does NOT use it — agent API keys live in the DB.
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY:-}
      # PORT drives both the container's listen port and the host mapping.
      PORT: ${PORT:-4000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.PORT||4000)+'/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Self-hosted mem0 API server (#212 D8). Self-built image — the official
  # mem0/mem0-api-server has no linux/amd64 manifest.
  # Bound to loopback only (security review #212): the mem0 server holds all
  # agent memories — LAN exposure would let anyone read/write them. The app
  # connects via the Settings UI's Mem0 Server URL. Note: inside the Docker
  # network the app reaches mem0 at http://mem0:8000 (service name), while
  # host-side tools use http://localhost:8890.
  mem0:
    build: ./docker/mem0
    ports:
      - '127.0.0.1:8890:8000'
    environment:
      # LLM + embedder: point at your OpenAI-compatible provider (D8).
      # Config key is openai_base_url — hence OPENAI_BASE_URL (OPENAI_API_BASE
      # is deprecated upstream).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:-gpt-4.1-nano-2025-04-14}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      # Custom embedders need the dims (e.g. text-embedding-v4 = 1024, not 1536).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-}
      # Local deployment: AUTH_DISABLED=true, or set ADMIN_API_KEY for auth.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Postgres (pgvector) — password is required by the upstream server.
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0-local}
      APP_DB_NAME: mem0_app
      POSTGRES_COLLECTION_NAME: memories
      # Anonymous telemetry fully disabled (D11).
      MEM0_TELEMETRY: 'false'
    depends_on:
      - pgvector
    restart: unless-stopped
    healthcheck:
      # GET /configure returns 200 without auth; the root path redirects.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/configure')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Postgres with the pgvector extension for mem0's vector store (D8).
  # pgvector/pgvector:pg16 (ankane/pgvector:v0.5.1 has no amd64 support).
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0-local}
      POSTGRES_DB: postgres
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  workflow-data:
  pgvector-data:
