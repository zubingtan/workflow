# T6 (#116 #122): single-command zero-config deployment.
# T5 (#216): mem0 + pgvector services for persistent agent memory.
#
# Usage:
#   docker compose up -d           # start (app + mem0 + pgvector)
#   docker compose logs -f app     # tail logs
#   docker compose down            # stop (keeps data volumes)
#   docker compose down -v         # stop + delete all data
#
# fake-provider (dev mock) validates request Authorization headers against
# FAKE_PROVIDER_API_KEY. Set it in your shell before `docker compose up`. The
# server itself no longer needs any API key env — agent credentials are stored
# in the DB (set via the Agents UI). Do NOT put secrets in a .env file next to
# this compose file — that's what `environment:` passthrough avoids.
#
# Port override: `PORT=8080 docker compose up` listens on 8080 instead of 4000.
#
# mem0 memory service (T5 #216):
#   OPENAI_API_KEY / OPENAI_BASE_URL configure the LLM+embedding provider.
#   mem0 API is at http://localhost:8890 (host) → 8000 (container).
#   pgvector data persists in the pgvector-data volume.

services:
  app:
    build: .
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    volumes:
      - workflow-data:/app/data
    environment:
      # fake-provider (dev mock) reads this to validate request Authorization
      # headers. The server does NOT use it — agent API keys live in the DB.
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY:-}
      # PORT drives both the container's listen port and the host mapping.
      PORT: ${PORT:-4000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.PORT||4000)+'/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- T5 (#216): mem0 persistent memory service ---
  mem0:
    build: ./docker/mem0
    ports:
      - '127.0.0.1:8890:8000'
    volumes:
      - mem0-history:/app/history
    environment:
      # LLM / Embedding provider (OpenAI-compatible).
      MEM0_LLM_API_KEY: ${MEM0_LLM_API_KEY:-}
      MEM0_LLM_BASE_URL: ${MEM0_LLM_BASE_URL:-}
      # Model configuration (override for non-OpenAI providers).
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-gpt-5-mini}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-}
      # Disable telemetry.
      MEM0_TELEMETRY: 'false'
      # Auth: use ADMIN_API_KEY for programmatic access, or AUTH_DISABLED for
      # local dev. Set one or the other via shell env before compose up.
      AUTH_DISABLED: ${MEM0_AUTH_DISABLED:-true}
      ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY:-}
      # PostgreSQL (pgvector) connection.
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: '5432'
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD:-mem0}
      POSTGRES_DB: mem0
      # App-layer database (auth, config, request_logs).
      APP_DB_NAME: mem0_app
    depends_on:
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- T5 (#216): pgvector (PostgreSQL + vector extension) ---
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD:-mem0}
      POSTGRES_DB: mem0
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./docker/mem0/init-app-db.sql:/docker-entrypoint-initdb.d/init-app-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mem0']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  workflow-data:
  pgvector-data:
  mem0-history:
