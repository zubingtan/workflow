; #293/#295: single workflow instance (prod build) + verification fake-provider.
; Template with {{PLACEHOLDERS}} — rendered by install.sh / bootstrap.sh:
;   {{WF_DIR}} {{NODE_BIN}} {{PORT}} {{BASE_PATH}} {{DATA_DIR}} {{FAKE_PROVIDER_PORT}}
;
; Both programs pin the Node binary explicitly ({{NODE_BIN}}) — the shell
; default (nvm "default" alias) may be Node 25, which has no better-sqlite3
; binding.

[program:workflow]
directory={{WF_DIR}}
command={{NODE_BIN}} server/index.mjs
environment=
    NODE_ENV="production",
    PORT="{{PORT}}",
    BASE_PATH="{{BASE_PATH}}",
    WORKFLOW_DATA_DIR="{{DATA_DIR}}"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile={{DATA_DIR}}/logs/workflow.out.log
stderr_logfile={{DATA_DIR}}/logs/workflow.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Verification-only LLM stand-in (#294): deterministic replies via
; PUT /test/control {correlationId, rawDetail}. Reachable at
; http://<host>:{{FAKE_PROVIDER_PORT}} (0.0.0.0) so the local verify script
; can register controls without ssh port-forwarding.
[program:fake-provider]
directory={{WF_DIR}}
command={{NODE_BIN}} scripts/fake-provider.mjs
environment=
    FAKE_PROVIDER_PORT="{{FAKE_PROVIDER_PORT}}"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile={{DATA_DIR}}/logs/fake-provider.out.log
stderr_logfile={{DATA_DIR}}/logs/fake-provider.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
