; #293/#295: single workflow instance (prod build) + verification fake-provider.
; Install: sudo cp workflow.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; Both programs pin the Node 22 binary explicitly — the shell default (nvm
; "default" alias) is Node 25, which has no better-sqlite3 binding.

[program:workflow]
directory=/home/zubingtan/projects/workflow
command=/home/zubingtan/.nvm/versions/node/v22.23.1/bin/node server/index.mjs
environment=
    NODE_ENV="production",
    PORT="4000",
    BASE_PATH="/workflow",
    WORKFLOW_DATA_DIR="/home/zubingtan/.config/workflow"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/zubingtan/.config/workflow/logs/workflow.out.log
stderr_logfile=/home/zubingtan/.config/workflow/logs/workflow.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Verification-only LLM stand-in (#294): deterministic replies via
; PUT /test/control {correlationId, rawDetail}. Reachable at
; http://<w8-ip>:4010 (0.0.0.0) so the local verify script can register
; controls without ssh port-forwarding.
[program:fake-provider]
directory=/home/zubingtan/projects/workflow
command=/home/zubingtan/.nvm/versions/node/v22.23.1/bin/node scripts/fake-provider.mjs
environment=
    FAKE_PROVIDER_PORT="4010"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/zubingtan/.config/workflow/logs/fake-provider.out.log
stderr_logfile=/home/zubingtan/.config/workflow/logs/fake-provider.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
