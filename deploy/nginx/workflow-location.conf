# #292/#293: workflow sub-path mount — nginx keeps the prefix, the app is
# base-path aware (BASE_PATH=/workflow, #297).
#
# This is a `location` FRAGMENT meant to be `include`d inside the
# zubingtan-w8.corp.pony.ai server block (see bootstrap.sh, which migrates
# the live /tmp/workflow-nginx.conf into /etc/nginx/conf.d/ and inserts
# `include /etc/nginx/conf.d/workflow-location.conf;`).
#
# proxy_pass WITHOUT a trailing URI = path forwarded as-is (no stripping).
# SSE tuning (per research/nginx-subpath-mount.md §4.3): HTTP/1.1 + buffering
# off + long read timeout — the app heartbeats every 25s and already sends
# X-Accel-Buffering: no, so these are belt-and-braces.

location /workflow/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (/api/runs/events, /api/workflows/:id/runs/events)
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    gzip off;
}

# Bare /workflow → /workflow/ so the SPA loads without a trailing slash.
location = /workflow {
    return 301 /workflow/;
}
