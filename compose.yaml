services:
  app:
    build:
      context: .
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "server.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_BINDINGS_FILE: ${PROVIDER_BINDINGS_FILE}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "scripts/worker.mjs"]
    env_file:
      - path: ${WORKFLOW_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_BINDINGS_FILE: ${PROVIDER_BINDINGS_FILE}
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY}
      WORKER_PROVIDER_TIMEOUT_MS: ${WORKER_PROVIDER_TIMEOUT_MS:-30000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-300000}
      WORKER_FAULT_HOOK: ${WORKER_FAULT_HOOK:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4011/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - workflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        for migration in /migrations/*.sql; do
          migration_name=$$(basename "$$migration")
          if psql -Atq -c "SELECT to_regclass('public.schema_migrations') IS NOT NULL" | grep -qx t \
            && psql -Atq \
              -c "SELECT 1 FROM schema_migrations WHERE name = '$$migration_name'" | grep -qx 1; then
            continue
          fi
          psql --single-transaction --set ON_ERROR_STOP=1 --file "$$migration"
        done
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fake-provider:
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "scripts/fake-provider.mjs"]
    environment:
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  workflow-postgres:
