services:
  app:
    build:
      context: .
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "server.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_BINDINGS_FILE: ${PROVIDER_BINDINGS_FILE}
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4011/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - workflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: postgres:18-bookworm
    command: ["psql", "--set", "ON_ERROR_STOP=1", "--file", "/migrations/001_bootstrap.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fake-provider:
    image: workflow-m0:${WORKFLOW_IMAGE_TAG:-local}
    command: ["node", "scripts/fake-provider.mjs"]
    environment:
      FAKE_PROVIDER_API_KEY: ${FAKE_PROVIDER_API_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  workflow-postgres:
